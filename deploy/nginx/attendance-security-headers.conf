# Security headers for the Attendance Intelligence frontend (replaces the headers block of vercel.json, finding FE-01 to FE-04).
# Kept in a file of its own because nginx drops the headers of the server block in any location that has an add_header of its own.
# Include this file in every location that sets its own add_header.
# connect-src 'self' is enough because the frontend is built WITHOUT VITE_API_URL, so it calls /api on its own address (this also closes FE-05).
# If the backend is on a different address instead, add that exact address to connect-src and set CORS_ORIGINS on the backend.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
