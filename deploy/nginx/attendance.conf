# Attendance Intelligence on one server: nginx serves the built frontend and forwards /api to the backend.
# Put this file in /etc/nginx/conf.d/ (it is read inside the http block) and the headers file next to it.
# Replace attendance.example.org, the certificate paths and the folder of the built frontend.
#
# Backend start (systemd or Docker), listening only on the local machine:
#   uvicorn main:app --host 127.0.0.1 --port 8000 --no-server-header
# Backend settings: TRUSTED_PROXIES=1 (nginx is the one proxy), ENABLE_DOCS unset (off), CORS_ORIGINS=https://attendance.example.org,
# a real JWT_SECRET, and the database role that does not own the audit table.

server_tokens off;                      # no nginx version in the Server header

upstream attendance_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name attendance.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name attendance.example.org;

    ssl_certificate     /etc/ssl/attendance/fullchain.pem;
    ssl_certificate_key /etc/ssl/attendance/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/attendance;           # the folder made by: VITE_API_URL= npm run build  (the dist folder)
    index index.html;

    # The upload limit of the backend is 25 MB. A little more here lets the backend give its own clear answer.
    client_max_body_size 26m;

    # Headers are included in each location below that sets its own add_header (see the note in the headers file).
    # The /api location has none: the backend sets its own security headers on its answers, and adding these too would repeat them.

    # The API. Only /api is forwarded, so /docs, /redoc and /openapi.json are never reachable from outside.
    location /api/ {
        proxy_pass http://attendance_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for ADDS the address nginx saw to the end of the header. With TRUSTED_PROXIES=1 the
        # backend believes only that last entry, so a client cannot fake its address (login lockout, rate limits).
        # Never replace this with $http_x_forwarded_for.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files with a hash in the name can be kept for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/attendance-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single page app: every other path gets index.html (same as the rewrite in vercel.json).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/attendance-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
